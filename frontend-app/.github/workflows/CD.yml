name: CI/CD Pipeline


on:
    push:
        branches:
            - main
env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/front-session16
  VITE_API_URL: https://api.43.lebondeveloppeur.net



jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6

            - name: install dependencies
              run: npm i

            - name: run test
              run: npm run test


    sonarqube-code-quality-scan-job:
        runs-on: ubuntu-latest
        steps:
            - name: Clone Source Code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
               node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: SonarQube Scan
              uses: sonarsource/sonarqube-scan-action@master
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                
    grype-scan:
        runs-on: ubuntu-latest
        needs: [test, sonarqube-code-quality-scan-job]
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: build image docker
              run: docker build -t ${{env.IMAGE_NAME}} --build-arg VITE_API_URL=${{env.VITE_API_URL}} .
            - name: Scan image
              uses: anchore/scan-action@v7
              with:
                image: ${{env.IMAGE_NAME}}
                fail-build: false
                severity-cutoff: "critical"

    snyk-code-security-scan-job:
          runs-on: ubuntu-latest
          needs: [test, sonarqube-code-quality-scan-job]
          steps:

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Dependency Scanning Tool (Snyk)
              run: npm install -g snyk

            - name: Snyk Authentication
              run: snyk auth ${{ secrets.SNYK_TOKEN }}

            - name: Run Snyk Vulnerability Scan
              run: snyk monitor --all-projects --org=gadourmh 
  
    push-and-build:
        runs-on: ubuntu-latest
        needs: [grype-scan]
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: build image docker
              run: docker build -t ${{env.IMAGE_NAME}} --build-arg VITE_API_URL=${{env.VITE_API_URL}} .
            - name: tag  image version
              run: docker tag ${{env.IMAGE_NAME}} ${{env.IMAGE_NAME}}:${{github.run_number}}
            - name: list images 
              run: docker images
            - name: docker login
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }} 
            - name: push image
              run: docker push ${{env.IMAGE_NAME}}:${{github.run_number}}
            - name: push image
              run: docker push ${{env.IMAGE_NAME}}
    deploy:
        runs-on: ubuntu-latest
        needs: push-and-build
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                 host:   ${{ secrets.VPS_HOST }}
                 username: ${{ secrets.VPS_USERNAME }}
                 password: ${{ secrets.VPS_PASSWORD }}
                 script: |
                     cd /home/user/devops-scripts/frontend
                     sudo docker compose pull front
                     sudo docker compose up -d front --force-recreate
    notify-slack:
          runs-on: ubuntu-latest
          needs:
            - test
            - sonarqube-code-quality-scan-job
            - grype-scan
            - snyk-code-security-scan-job
            - push-and-build
            - deploy
          if: always()

          steps:
            - name: Send Slack Notification
              uses: slackapi/slack-github-action@v2.1.1
              with:
                webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                webhook-type: incoming-webhook
                payload: |
                  text: "Deployment Pipeline Result"
                  blocks:
                    - type: header
                      text:
                        type: plain_text
                        text: "🚀 Frontend Deployment Pipeline"

                    - type: section
                      text:
                        type: mrkdwn
                        text: |
                          *Repository:* ${{ github.repository }}
                          *Branch:* ${{ github.ref_name }}
                          *Run:* #${{ github.run_number }}

                    - type: section
                      fields:
                        - type: mrkdwn
                          text: "*Unit Tests:* ${{ needs.test.result }}"
                        - type: mrkdwn
                          text: "*SonarQube:* ${{ needs.sonarqube-code-quality-scan-job.result }}"
                        - type: mrkdwn
                          text: "*Grype Scan:* ${{ needs.grype-scan.result }}"
                        - type: mrkdwn
                          text: "*Snyk Scan:* ${{ needs.snyk-code-security-scan-job.result }}"
                        - type: mrkdwn
                          text: "*Build & Push:* ${{ needs.push-and-build.result }}"
                        - type: mrkdwn
                          text: "*Deployment:* ${{ needs.deploy.result }}"

                    - type: section
                      text:
                        type: mrkdwn
                        text: "*Workflow URL:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
